# SPDX-License-Identifier: GPL-3.0-or-later
name: ci

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Prebuilt ps5-payload-sdk + pacbrew libraries (ps5-payload-dev/pacbrew-repo release).
  PACBREW_VERSION: v0.40.2
  PACBREW_SHA256: a85f65de418a8e6a898c6c3e3c870d50fff7618a200e4dd59ea9692af6ecec4d

jobs:
  host:
    name: Host build and tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake ninja-build pkg-config \
            libcurl4-openssl-dev libsqlite3-dev libarchive-dev libsdl2-dev libsdl2-ttf-dev libsdl2-image-dev

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug -DAKENO_WARNINGS_AS_ERRORS=ON

      - name: Build
        run: cmake --build build

      - name: Unit tests
        run: ctest --test-dir build --output-on-failure

      - name: Headless system check against the mock ShadowMountPlus API
        run: |
          # Default port 10101: the demo catalogue's file addresses use it.
          python3 tools/mock_shadowmount.py &
          sleep 1
          ./build/src/ui/AkenoModManager --self-check --data-root "$RUNNER_TEMP/akeno"
          ./build/AkenoSelfCheck --data-root "$RUNNER_TEMP/akeno"
          ./build/src/ui/AkenoModManager --list-games --data-root "$RUNNER_TEMP/akeno"
          # Download engine end to end: a demo archive from the mock server, checked and deleted.
          file=tests/fixtures/catalog/files/example-blade-akeno-test-file-1.0.0.zip
          ./build/src/ui/AkenoModManager --download-test --data-root "$RUNNER_TEMP/akeno" \
            --download-test-url "http://127.0.0.1:10101/files/$(basename "$file")" \
            --download-test-sha256 "$(sha256sum "$file" | cut -d' ' -f1)" --download-test-size "$(stat -c %s "$file")"
          test -z "$(ls -A "$RUNNER_TEMP/akeno/downloads")"

      - name: User interface smoke test (offscreen)
        env:
          SDL_VIDEODRIVER: offscreen
        run: |
          ./build/src/ui/AkenoModManager --data-root "$RUNNER_TEMP/akeno-ui" \
            --catalogue-url http://127.0.0.1:10101/catalog/ --window 1920x1080 --ui-script \
            "wait:3,shot:01-first-run,confirm,wait:3,confirm,wait:1,confirm,wait:2,confirm,confirm,confirm,confirm,wait:2,shot:02-home,next-tab,wait:2,shot:03-games,confirm,wait:2,shot:04-details,down,down,confirm,wait:3,shot:14-diagnostics,back,next-tab,wait:2,shot:06-discover,confirm,wait:2,shot:07-mods,tertiary,type:hair,wait:2,shot:08-search,options,wait:2,confirm,wait:2,shot:09-mod-details,down,confirm,wait:2,shot:10-screenshot,back,up,confirm,wait:3,shot:11-downloaded,back,back,back,next-tab,wait:1,shot:12-downloads,confirm,wait:3,shot:13-check,back,next-tab,next-tab,next-tab,shot:05-settings,quit"
          ls "$RUNNER_TEMP/akeno-ui/logs"
          for shot in 01-first-run 02-home 03-games 04-details 05-settings 06-discover 07-mods 08-search 09-mod-details 10-screenshot 11-downloaded 12-downloads 13-check 14-diagnostics; do
            test -s "$RUNNER_TEMP/akeno-ui/logs/$shot.png"
          done
          grep -q "catalogue loaded: 3 games" "$RUNNER_TEMP/akeno-ui/logs/akeno.log"
          grep -q "completed and verified" "$RUNNER_TEMP/akeno-ui/logs/akeno.log"
          grep -q "files to install" "$RUNNER_TEMP/akeno-ui/logs/akeno.log"
          test -z "$(ls -A "$RUNNER_TEMP/akeno-ui/staging")"
          python3 - <<'PYREPORT'
          import json, os
          from pathlib import Path
          reports = list((Path(os.environ["RUNNER_TEMP"]) / "akeno-ui/logs/diagnostics").glob("*.json"))
          assert len(reports) == 1, reports
          report = json.loads(reports[0].read_text())
          assert report["schemaVersion"] == 3
          assert report["diagnosticsMode"] == "quick"
          assert report["titles"][0]["titleId"] == "PPSA90001"
          assert report["titles"][0]["selection"].get("status") is not None
          assert report["activationPerformed"] is False
          assert report["gameLaunchPerformed"] is False
          assert report["gameAssetsExported"] is False
          PYREPORT

      - name: Upload screenshots
        uses: actions/upload-artifact@v4
        with:
          name: host-ui-screenshots
          path: ${{ runner.temp }}/akeno-ui/logs/*.png
          if-no-files-found: error

  sanitizers:
    name: Tests with AddressSanitizer and UBSan
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake ninja-build pkg-config \
            libcurl4-openssl-dev libsqlite3-dev libarchive-dev
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug -DAKENO_BUILD_APP=OFF -DAKENO_SANITIZE=ON
      - name: Build
        run: cmake --build build
      - name: Unit tests
        run: ctest --test-dir build --output-on-failure

  ps5:
    name: PS5 build (ps5-payload-sdk)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install LLVM 18 and build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang-18 lld-18 llvm-18 cmake ninja-build pkg-config

      - name: Download the PS5 SDK and libraries
        run: |
          curl -fsSL -o ps5-payload-dev.tar.gz \
            "https://github.com/ps5-payload-dev/pacbrew-repo/releases/download/${PACBREW_VERSION}/ps5-payload-dev.tar.gz"
          echo "${PACBREW_SHA256}  ps5-payload-dev.tar.gz" | sha256sum -c -
          sudo tar -xzf ps5-payload-dev.tar.gz -C /
          rm ps5-payload-dev.tar.gz

      - name: Configure
        env:
          PS5_PAYLOAD_SDK: /opt/ps5-payload-sdk
        run: |
          cmake -S . -B build-ps5 -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE=/opt/ps5-payload-sdk/toolchain/prospero.cmake

      - name: Build
        env:
          PS5_PAYLOAD_SDK: /opt/ps5-payload-sdk
        run: cmake --build build-ps5

      - name: Verify artifacts
        run: |
          file build-ps5/dist/AkenoModManager.elf build-ps5/dist/AkenoSelfCheck.elf
          cd build-ps5/dist && sha256sum -c SHA256SUMS

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: AkenoModManager-ps5-${{ github.sha }}
          path: |
            build-ps5/dist/AkenoModManager.elf
            build-ps5/dist/AkenoSelfCheck.elf
            build-ps5/dist/AkenoModManager-homebrew.zip
            build-ps5/dist/SHA256SUMS
          if-no-files-found: error
